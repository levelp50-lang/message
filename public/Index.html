<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outreach Sequencer — Zetsu Corp</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --surface: #111114;
    --surface2: #18181d;
    --border: #2a2a32;
    --accent: #00e5c0;
    --accent2: #ff5c3a;
    --text: #f0eeea;
    --muted: #6b6b78;
    --label: #9999aa;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 40px;
    display: flex; align-items: center; gap: 16px;
  }

  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent); flex-shrink: 0;
  }

  header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  header span { font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 400; }

  .main { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 69px); }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    display: flex; flex-direction: column; gap: 18px;
    overflow-y: auto;
  }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }

  label {
    display: block; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); margin-bottom: 6px;
  }

  input, textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 13px; padding: 10px 14px; outline: none; transition: border-color 0.15s; resize: none;
  }

  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { line-height: 1.6; }
  .field { display: flex; flex-direction: column; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; font-family: 'DM Mono', monospace; }
  .divider { border: none; border-top: 1px solid var(--border); }

  .btn-primary {
    background: var(--accent); color: #000; border: none; border-radius: 6px;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 14px 20px;
    cursor: pointer; width: 100%; transition: opacity 0.15s, transform 0.1s;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .results-pane { padding: 28px 32px; overflow-y: auto; }

  .empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 12px; color: var(--muted);
  }

  .empty-icon { font-size: 40px; opacity: 0.15; }
  .empty p { font-size: 14px; letter-spacing: 0.05em; }

  .lead-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 20px; overflow: hidden;
    animation: fadeUp 0.3s ease forwards; opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 14px 18px; display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #1a2a28; border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: var(--accent); flex-shrink: 0;
  }

  .card-meta { flex: 1; }
  .card-name { font-size: 14px; font-weight: 700; }
  .card-contact { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

  .status-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 4px; border: 1px solid;
  }

  .status-queued { background: #1a2a28; color: var(--accent); border-color: #1f3d38; }
  .status-sent { background: #1a2a1a; color: #4cdb8a; border-color: #1f3d28; }
  .status-failed { background: #2a1a18; color: var(--accent2); border-color: #3d1f1a; }

  .card-body { display: grid; grid-template-columns: 1fr 1fr; }

  .msg-block { padding: 16px 18px; border-right: 1px solid var(--border); }
  .msg-block:last-child { border-right: none; }

  .msg-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .day-badge {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px; font-size: 10px; color: var(--label);
  }

  .subject-line { font-size: 13px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }

  .msg-text {
    font-size: 12px; font-family: 'DM Mono', monospace;
    color: #c0bec8; line-height: 1.7; white-space: pre-wrap;
  }

  .card-actions { display: flex; gap: 8px; margin-top: 12px; }

  .action-btn {
    flex: 1; background: transparent; border: 1px solid var(--border);
    border-radius: 5px; color: var(--label); font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 10px; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.send-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .action-btn.done { border-color: #4cdb8a; color: #4cdb8a; }
  .action-btn.fail { border-color: var(--accent2); color: var(--accent2); }

  .char-count { font-size: 11px; font-family: 'DM Mono', monospace; margin-top: 6px; }
  .char-ok { color: var(--accent); }
  .char-over { color: var(--accent2); }

  .loading-bar { display: none; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
  .loading-bar.active { display: block; }
  .loading-bar::after {
    content: ''; display: block; height: 100%; width: 40%;
    background: var(--accent); animation: slide 1.2s ease-in-out infinite;
  }

  @keyframes slide {
    0% { transform: translateX(-200%); }
    100% { transform: translateX(350%); }
  }

  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .results-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .count-badge {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 3px 12px; border-radius: 20px;
    font-size: 12px; font-family: 'DM Mono', monospace; color: var(--label);
  }

  .err {
    background: #1a0f0d; border: 1px solid #3a1a15; border-radius: 8px;
    padding: 14px 18px; color: var(--accent2); font-size: 13px; font-family: 'DM Mono', monospace;
  }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>Outreach Sequencer <span>— Zetsu Corp</span></h1>
</header>

<div class="main">
  <aside class="sidebar">
    <div>
      <p class="section-label">Campaign Setup</p>
      <div class="field">
        <label>Your Name / Brand</label>
        <input id="brand" type="text" value="Kevin — Zetsu Corp" />
      </div>
    </div>

    <div class="field">
      <label>Offer / Product</label>
      <input id="offer" type="text" placeholder="Business in a Box — $49" />
    </div>

    <div class="field">
      <label>Landing Page URL</label>
      <input id="link" type="text" placeholder="https://zetsuedu.com/..." />
    </div>

    <hr class="divider" />

    <div class="field">
      <label>Leads — Name, Email, Phone</label>
      <textarea id="leads" rows="8" placeholder="John Smith, john@email.com, 3135550100&#10;Maria Torres, maria@email.com, 3135550101"></textarea>
      <p class="hint">One per line. Phone = 10 digits, no dashes.</p>
    </div>

    <button class="btn-primary" id="genBtn" onclick="generate()">Generate Sequences</button>
  </aside>

  <section class="results-pane" id="results">
    <div class="empty">
      <div class="empty-icon">✦</div>
      <p>Fill in your leads and hit Generate</p>
    </div>
  </section>
</div>

<script>
  let sequences = [];

  async function generate() {
    const brand = document.getElementById('brand').value.trim();
    const offer = document.getElementById('offer').value.trim();
    const link = document.getElementById('link').value.trim();
    const leadsRaw = document.getElementById('leads').value.trim();
    const results = document.getElementById('results');
    const btn = document.getElementById('genBtn');

    if (!offer || !leadsRaw) {
      results.innerHTML = '<div class="err">Add your offer and at least one lead.</div>';
      return;
    }

    const leads = leadsRaw.split('\n').map(l => {
      const p = l.split(',').map(x => x.trim());
      return { name: p[0] || 'there', email: p[1] || '', phone: p[2] || '' };
    }).filter(l => l.name);

    btn.disabled = true;
    btn.textContent = 'Writing sequences...';

    results.innerHTML = `
      <div class="loading-bar active"></div>
      <div class="results-header">
        <span class="results-title">Generating ${leads.length} sequence${leads.length !== 1 ? 's' : ''}...</span>
      </div>`;

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ offer, link, brand, leads })
      });

      const raw = await res.text();
      let parsed;
      try { parsed = JSON.parse(raw); } catch(je) {
        results.innerHTML = '<div class="err">Bad response from server:<br><pre>' + raw + '</pre></div>';
        btn.disabled = false; btn.textContent = 'Generate Sequences'; return;
      }
      if (!parsed.sequences || !Array.isArray(parsed.sequences)) {
        results.innerHTML = '<div class="err">Unexpected response:<br><pre>' + JSON.stringify(parsed, null, 2) + '</pre></div>';
        btn.disabled = false; btn.textContent = 'Generate Sequences'; return;
      }
      sequences = parsed.sequences;
      renderResults(sequences);
    } catch(e) {
      results.innerHTML = `<div class="err">Generation failed.\n\n${e.message}</div>`;
    }

    btn.disabled = false;
    btn.textContent = 'Generate Sequences';
  }

  function renderResults(seqs) {
    const results = document.getElementById('results');
    let html = `
      <div class="results-header">
        <span class="results-title">Sequences ready</span>
        <span class="count-badge">${seqs.length} lead${seqs.length !== 1 ? 's' : ''}</span>
      </div>`;

    seqs.forEach((s, i) => {
      const charClass = s.sms.length > 160 ? 'char-over' : 'char-ok';
      html += `
      <div class="lead-card" id="card-${i}" style="animation-delay:${i*80}ms">
        <div class="card-header">
          <div class="avatar">${s.name.charAt(0).toUpperCase()}</div>
          <div class="card-meta">
            <div class="card-name">${s.name}</div>
            <div class="card-contact">${s.email}${s.phone ? ' · ' + s.phone : ''}</div>
          </div>
          <span class="status-badge status-queued" id="status-${i}">Queued</span>
        </div>
        <div class="card-body">
          <div class="msg-block">
            <div class="msg-tag">Email <span class="day-badge">Day 1</span></div>
            <div class="subject-line">${s.email_subject}</div>
            <div class="msg-text" id="email-body-${i}">${s.email_body}</div>
            <div class="card-actions">
              <button class="action-btn" onclick="copyBlock('email-body-${i}', this)">Copy</button>
              <button class="action-btn send-btn" onclick="sendEmail(${i})">Send Email</button>
            </div>
          </div>
          <div class="msg-block">
            <div class="msg-tag">SMS <span class="day-badge">Day 3</span></div>
            <div class="msg-text" id="sms-body-${i}">${s.sms}</div>
            <p class="char-count ${charClass}">${s.sms.length} / 160 chars</p>
            <div class="card-actions">
              <button class="action-btn" onclick="copyBlock('sms-body-${i}', this)">Copy</button>
              <button class="action-btn send-btn" id="sms-btn-${i}" onclick="sendSMS(${i})">Send SMS</button>
            </div>
          </div>
        </div>
      </div>`;
    });

    results.innerHTML = html;
  }

  async function sendEmail(i) {
    const s = sequences[i];
    if (!s.email) { alert('No email for this lead.'); return; }

    const btns = document.querySelectorAll(`#card-${i} .send-btn`);
    const btn = btns[0];
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: s.email,
          subject: s.email_subject,
          body: document.getElementById(`email-body-${i}`).textContent
        })
      });

      const data = await res.json();
      if (data.success) {
        btn.textContent = 'Sent ✓';
        btn.classList.add('done');
        setStatus(i, 'sent');
      } else {
        btn.textContent = 'Failed';
        btn.classList.add('fail');
        console.error(data.error);
      }
    } catch(e) {
      btn.textContent = 'Failed';
      btn.classList.add('fail');
    }
    btn.disabled = false;
  }

  async function sendSMS(i) {
    const s = sequences[i];
    if (!s.phone) { alert('No phone number for this lead.'); return; }

    const btns = document.querySelectorAll(`#card-${i} .send-btn`);
    const btn = btns[1];
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const res = await fetch('/api/send-sms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: s.phone,
          message: document.getElementById(`sms-body-${i}`).textContent
        })
      });

      const data = await res.json();
      if (data.success) {
        btn.textContent = 'Sent ✓';
        btn.classList.add('done');
      } else {
        btn.textContent = 'Failed';
        btn.classList.add('fail');
        console.error(data.error);
      }
    } catch(e) {
      btn.textContent = 'Failed';
      btn.classList.add('fail');
    }
    btn.disabled = false;
  }

  function setStatus(i, type) {
    const el = document.getElementById(`status-${i}`);
    if (!el) return;
    el.className = `status-badge status-${type}`;
    el.textContent = type.charAt(0).toUpperCase() + type.slice(1);
  }

  function copyBlock(id, btn) {
    const el = document.getElementById(id);
    if (!el) return;
    navigator.clipboard.writeText(el.textContent.trim()).then(() => {
      btn.textContent = 'Copied ✓';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
    });
  }
</script>
</body>
</html>
